name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
      - name: Validate tag and build package
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate-release.py "$GITHUB_REF_NAME"
          npm --prefix frontend install
          npm --prefix frontend run lint
          npm --prefix frontend run test
          scripts/build-frontend.sh
          scripts/build-frontend.sh --check
          uv run pytest -q
          uvx pyright
          uv build --out-dir dist
          python scripts/validate-release.py "${GITHUB_REF_NAME}" dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          response=$(mktemp)
          release_endpoint="repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"
          if gh api --include "$release_endpoint" > "$response" 2>&1; then
            echo "Release $TAG already exists; refusing to publish." >&2
            exit 1
          fi
          if ! head -n 1 "$response" | grep -Eq '^HTTP/[0-9.]+ 404( |$)'; then
            echo "Could not confirm that release $TAG is absent:" >&2
            head -n 1 "$response" >&2
            exit 1
          fi
          wheel="dist/jev_gateway-${TAG#v}-py3-none-any.whl"
          if [[ "$TAG" =~ (a|b|rc)[0-9]+$ ]]; then
            gh release create "$TAG" \
              dist/install.sh dist/install.sh.sha256 \
              "$wheel" "$wheel.sha256" \
              --verify-tag --prerelease --latest=false --generate-notes
          else
            gh release create "$TAG" \
              dist/install.sh dist/install.sh.sha256 \
              "$wheel" "$wheel.sha256" \
              --verify-tag --latest --generate-notes
          fi
