name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: astral-sh/setup-uv@v5
      - name: Validate tag and build package
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.16.0
          node --version
          npm --version
          test "$(node --version)" = v22.23.3
          test "$(npm --version)" = 11.16.0
          python scripts/validate-release.py "$GITHUB_REF_NAME"
          npm --prefix frontend install
          npm --prefix frontend run lint
          npm --prefix frontend run test
          scripts/build-frontend.sh
          scripts/build-frontend.sh --check
          uv run pytest -q
          uvx pyright
          uv build --out-dir dist
          python scripts/validate-release.py "${GITHUB_REF_NAME}" dist
      - name: Locate release wheel
        id: assets
        shell: bash
        run: echo "wheel=dist/jev_gateway-${GITHUB_REF_NAME#v}-py3-none-any.whl" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/install.sh
            dist/install.sh.sha256
            ${{ steps.assets.outputs.wheel }}
            ${{ steps.assets.outputs.wheel }}.sha256
          if-no-files-found: error
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Smoke installed release wheel
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python scripts/smoke-installed-release.py --wheel "$PWD/dist/jev_gateway-${version}-py3-none-any.whl" --version "$version" --work-dir "$RUNNER_TEMP/jev installed smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/jev installed smoke/evidence
  release:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          response=$(mktemp)
          release_endpoint="repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"
          if gh api --include "$release_endpoint" > "$response" 2>&1; then
            echo "Release $TAG already exists; refusing to publish." >&2
            exit 1
          fi
          if ! head -n 1 "$response" | grep -Eq '^HTTP/[0-9.]+ 404( |$)'; then
            echo "Could not confirm that release $TAG is absent:" >&2
            head -n 1 "$response" >&2
            exit 1
          fi
          wheel="dist/jev_gateway-${TAG#v}-py3-none-any.whl"
          if [[ "$TAG" =~ (a|b|rc)[0-9]+$ ]]; then
            gh release create "$TAG" \
              dist/install.sh dist/install.sh.sha256 \
              "$wheel" "$wheel.sha256" \
              --verify-tag --prerelease --latest=false --generate-notes
          else
            gh release create "$TAG" \
              dist/install.sh dist/install.sh.sha256 \
              "$wheel" "$wheel.sha256" \
              --verify-tag --latest --generate-notes
          fi
