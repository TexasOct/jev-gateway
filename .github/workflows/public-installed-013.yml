name: Public installed 0.1.3 acceptance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag
        required: true
        default: v0.1.3
      expected_source:
        description: Signed release product source
        required: true
        default: 4d56e438e2f817115e65f9c47519f9adc62d41c1
      producer_run:
        description: Final tag producer run, attempt 1
        required: true
        default: '37967881650'

permissions:
  contents: read
  actions: read

jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@v4
        with:
          path: preparation
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_source }}
          path: signed-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.0'
      - name: Set ephemeral runner toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.16.0
          test "$(node --version)" = v22.23.3
          test "$(npm --version)" = 11.16.0
          uv pip install --python "$(command -v python)" psutil==7.2.2
      - name: Execute public installed business acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPT_TAG: ${{ inputs.tag }}
          ACCEPT_SOURCE: ${{ inputs.expected_source }}
          ACCEPT_PRODUCER: ${{ inputs.producer_run }}
        shell: bash
        run: |
          set -euo pipefail
          python preparation/scripts/public-installed/driver.py \
            --source "$GITHUB_WORKSPACE/signed-source" \
            --work-dir "$RUNNER_TEMP/public installed acceptance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --tag "$ACCEPT_TAG" --expected-source "$ACCEPT_SOURCE" --producer-run "$ACCEPT_PRODUCER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-installed-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public installed acceptance-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          if-no-files-found: error
          retention-days: 30
