<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="JEV routing flow from request model to final catalog route">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBypass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="540" fill="#ffffff"/>

  <text x="40" y="44" font-size="24" font-weight="700" fill="#0f172a">JEV routing: request model to final route</text>
  <text x="40" y="70" font-size="13" fill="#64748b">One request resolves to one catalog model. Session mode can pin that route, or reconsider it on later turns.</text>

  <!-- Bypass lane: a full catalog model ID skips strategy and label selection. -->
  <path d="M 120 132 L 120 100 L 1320 100 L 1320 132" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowBypass)"/>
  <rect x="520" y="86" width="400" height="30" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="720" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Full catalog ID in body.model: lock that model</text>

  <!-- Main flow: seven steps, left to right. -->
  <rect x="36" y="132" width="168" height="94" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="52" y="166" font-size="13" font-weight="700" fill="#1e3a8a">Request</text>
  <text x="52" y="188" font-size="11" fill="#475569">body.model</text>
  <text x="52" y="205" font-size="11" fill="#475569">strategy or model ID</text>

  <path d="M 204 179 L 232 179" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="236" y="132" width="168" height="94" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="252" y="166" font-size="13" font-weight="700" fill="#1e3a8a">Strategy select</text>
  <text x="252" y="188" font-size="11" fill="#475569">by name, else</text>
  <text x="252" y="205" font-size="11" fill="#475569">policy default</text>

  <path d="M 404 179 L 432 179" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="436" y="132" width="168" height="94" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="452" y="166" font-size="13" font-weight="700" fill="#1e3a8a">Label select</text>
  <text x="452" y="188" font-size="11" fill="#475569">from the request</text>
  <text x="452" y="205" font-size="11" fill="#475569">and strategy rules</text>

  <path d="M 604 179 L 632 179" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="636" y="132" width="168" height="94" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="652" y="166" font-size="13" font-weight="700" fill="#6b21a8">Compose tag</text>
  <text x="652" y="188" font-size="12" font-weight="600" fill="#7e22ce">strategy/label</text>
  <text x="652" y="205" font-size="11" fill="#475569">exact whole string</text>

  <path d="M 804 179 L 832 179" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="836" y="132" width="168" height="94" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="852" y="166" font-size="13" font-weight="700" fill="#1e3a8a">Find candidates</text>
  <text x="852" y="188" font-size="11" fill="#475569">models carrying</text>
  <text x="852" y="205" font-size="11" fill="#475569">that exact tag</text>

  <path d="M 1004 179 L 1032 179" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1036" y="132" width="168" height="94" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1052" y="166" font-size="13" font-weight="700" fill="#1e3a8a">Filter and rank</text>
  <text x="1052" y="188" font-size="11" fill="#475569">capability, context,</text>
  <text x="1052" y="205" font-size="11" fill="#475569">output, selection</text>

  <path d="M 1204 179 L 1232 179" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1236" y="132" width="168" height="94" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="1252" y="166" font-size="13" font-weight="700" fill="#065f46">Final route</text>
  <text x="1252" y="188" font-size="11" fill="#475569">one canonical</text>
  <text x="1252" y="205" font-size="11" fill="#475569">catalog model ID</text>

  <!-- Session rules feed back into selection between turns. -->
  <path d="M 1120 258 L 1120 226" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="636" y="258" width="568" height="56" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="652" y="282" font-size="13" font-weight="700" fill="#334155">Session rules (policy.mode)</text>
  <text x="652" y="302" font-size="11" fill="#475569">pin the route, or reconsider it when a break reason fires</text>

  <!-- Worked example: names only the abstract strategy and label path. -->
  <text x="40" y="356" font-size="15" font-weight="700" fill="#0f172a">Worked example</text>

  <rect x="32" y="374" width="256" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="400" font-size="12" font-weight="700" fill="#0f172a">Request</text>
  <text x="48" y="422" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1d4ed8">model: "quality"</text>
  <text x="48" y="443" font-size="10.5" fill="#64748b">names the quality strategy</text>

  <path d="M 288 416 L 312 416" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="312" y="374" width="256" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="328" y="400" font-size="12" font-weight="700" fill="#0f172a">Label</text>
  <text x="328" y="422" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1d4ed8">critical</text>
  <text x="328" y="443" font-size="10.5" fill="#64748b">highest label for this request</text>

  <path d="M 568 416 L 592 416" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="592" y="374" width="256" height="84" rx="10" fill="#faf5ff" stroke="#c084fc"/>
  <text x="608" y="400" font-size="12" font-weight="700" fill="#6b21a8">Tag</text>
  <text x="608" y="422" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7e22ce">quality/critical</text>
  <text x="608" y="443" font-size="10.5" fill="#64748b">strategy + label</text>

  <path d="M 848 416 L 872 416" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="872" y="374" width="256" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="888" y="400" font-size="12" font-weight="700" fill="#0f172a">Candidates</text>
  <text x="888" y="422" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1d4ed8">[tagged models]</text>
  <text x="888" y="443" font-size="10.5" fill="#64748b">exact match on quality/critical</text>

  <path d="M 1128 416 L 1152 416" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1152" y="374" width="256" height="84" rx="10" fill="#ecfdf5" stroke="#34d399"/>
  <text x="1168" y="400" font-size="12" font-weight="700" fill="#065f46">Selected route</text>
  <text x="1168" y="422" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#047857">provider/model</text>
  <text x="1168" y="443" font-size="10.5" fill="#64748b">after filters and selection</text>

  <text x="40" y="492" font-size="11.5" fill="#64748b">Strategies, labels, and tags are declared in models.json; tag lookup matches the whole string.</text>
  <text x="40" y="513" font-size="11.5" fill="#64748b">A JEV classifier is optional, and cached or fresh mode reclassifies later turns differently.</text>
</svg>
